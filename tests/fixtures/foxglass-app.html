<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Floss Fox V6 fixture</title><link rel="stylesheet" href="../../v6/foxglass-v6.css"><style>
body{font:16px system-ui;margin:0;background:#f8f4eb;color:#343b39}.wrap{padding:16px;max-width:950px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}header button{min-height:44px}.tabs{display:flex;gap:5px}.tabs button{min-height:44px}section{margin:10px 0} .card{border:1px solid #ddd4c4;padding:16px;background:#fffdf8;border-radius:14px}.nav-spare{display:none}
</style></head><body><main id="ffLanding">Old landing</main><div class="wrap"><header><p id="appname">Floss Fox</p><div><button id="ffSearchBtn" type="button">Search</button><button id="askPipBtn" type="button">Ask Pip</button></div></header>
<nav class="tabs"><button id="tabWorkbasket">Workbasket</button><button id="tabConvert">Find floss</button><button id="tabThreads">My threads</button><button id="tabProjects">Projects</button><button id="tabShop">Shop</button><button id="tabHelp">Help</button><button id="tabSettings">Settings</button></nav>
<div id="ffSearch" hidden>Search panel <input id="ffSearchIn" placeholder="find"></div><div id="askPip" hidden>Ask Pip panel</div><div id="workbasketView" hidden>Old workbasket</div>
<div id="convertView"><div class="card"><h2 id="heroH">Find floss</h2><textarea id="inp"></textarea><button type="button">Add colors</button></div></div>
<div id="threadsView" hidden><div class="card" id="thCard"><h2>My Thread Collection</h2><div class="thquick"><label>Add a thread <textarea id="thAdd"></textarea></label><button id="thAddBtn">Add</button><button id="thBulkBtn">Review a list first</button></div><section id="ffSmartStash"><button class="ffss-choice">Import a list</button><button class="ffss-choice">Choose colors</button><textarea id="ffssPaste"></textarea></section></div></div>
<div id="projectsView" hidden><div class="card" id="projListCard"><h2>My Projects</h2></div><div class="card" id="projEdit" hidden></div></div>
<div id="shopView" hidden><div id="shopCard" class="card"><h2>Shopping</h2><div id="shopBody"></div><div id="shopEmpty">Nothing yet</div><button type="button" id="ffauShopStart">Take a combined shopping list</button></div></div>
<div id="helpView" hidden><h2>Help</h2><button type="button" id="helpTour">Take the tour</button></div>
<div id="settingsView" hidden><h2>Settings</h2></div><div id="threadwoodView" hidden><h2>Pip's Den</h2></div>
</div><script>
window.__fixtureActions={tour:0,combined:0,import:0};
window.FlossFoxThreadsUI={data:()=>({threads:{310:{n:2},321:{n:1}}}),render:()=>{},leaveView:()=>{},tipDone:()=>{}};
window.FlossFoxProjects={_store:()=>({projects:[{id:'p1',name:'Forest Fox Sampler',status:'progress',updated:'2026-11-22T14:00:00Z',leftOff:'Start the border next.',items:[{code:'310'}]},{id:'p2',name:'Moonlit Needle',status:'planning',updated:'2026-11-21T12:00:00Z',items:[{code:'321'}]}]}),
 showView:function(k,fromHash){for(const id of ['workbasketView','convertView','threadsView','projectsView','shopView','helpView','settingsView','threadwoodView'])document.getElementById(id).hidden=id!==({workbasket:'workbasketView',convert:'convertView',threads:'threadsView',projects:'projectsView',shop:'shopView',help:'helpView',settings:'settingsView',threadwood:'threadwoodView'}[k]);if(!fromHash)history.pushState(null,'','#'+k)},
 open:function(id){this.showView('projects');const e=document.getElementById('projEdit');e.hidden=false;document.getElementById('projListCard').hidden=true;e.innerHTML=`<div><div><button id="pClose">All projects</button><button id="pShop">Shop my list</button></div><h2 id="pTitle">Forest Fox Sampler</h2><nav id="pFlow">Old four steps</nav></div><div id="pSum">Summary</div><div id="pReady">Readiness</div><div id="pTrust">Trust</div><div id="pCmp">Compare</div><div id="pKitGoRow"><button>Kit</button></div><details id="pMore"><summary>More for this project</summary><div class="pleftoff">Where I left off</div><div id="pCover">Cover photo</div><div id="pProgress">Progress <button>Save</button></div><div id="pSession">Timer</div><div id="ffauSessions">Stitching journal</div><div id="pSkein">Skein estimates</div><div id="pChartCmp">Chart matches</div><details id="pDetails"><summary>Project details</summary><input id="pName" value="Forest Fox Sampler"></details></details><section id="pThreads"><h3 id="pThreadsH">Colors for this piece</h3><ul><li>310</li></ul></section>`}
};
window.FlossFoxThreadwood={show:()=>window.FlossFoxProjects.showView('threadwood')};window.FFImportOpen=()=>{window.__fixtureActions.import++};
document.getElementById('helpTour').addEventListener('click',()=>window.__fixtureActions.tour++);
document.getElementById('ffauShopStart').addEventListener('click',()=>window.__fixtureActions.combined++);
document.getElementById('ffSearchBtn').onclick=()=>document.getElementById('ffSearch').hidden=!document.getElementById('ffSearch').hidden;
document.getElementById('askPipBtn').onclick=()=>document.getElementById('askPip').hidden=!document.getElementById('askPip').hidden;
</script><script src="../../v6/foxglass-v6.js"></script></body></html>
